name: render
on:
  repository_dispatch:
    types: [render]
concurrency:
  group: render-${{ github.event.client_payload.job }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache models and fonts
        uses: actions/cache@v4
        with:
          path: |
            models
            fonts
            voices
          key: assets-v1
      - name: Install tools
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null) &
          pip install -q -r requirements.txt
          mkdir -p models fonts
          [ -f models/depth.onnx ] || curl -sfL https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx -o models/depth.onnx
          [ -f fonts/Vazirmatn-Bold.ttf ] || curl -sfL https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf -o fonts/Vazirmatn-Bold.ttf
          wait
      - name: Render and send
        env:
          PLAN: ${{ github.event.client_payload.plan }}
          CHAT: ${{ github.event.client_payload.chat }}
          CAP: ${{ github.event.client_payload.cap }}
          JOB: ${{ github.event.client_payload.job }}
          WM: ${{ github.event.client_payload.wm }}
          VOICE: ${{ github.event.client_payload.voice }}
          NARR: ${{ github.event.client_payload.narr }}
          WORKER: ${{ secrets.WORKER }}
          VS: ${{ secrets.VIDEO_SECRET }}
          BOT: ${{ secrets.BOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python render.py
      - name: Report result to the bot
        if: always()
        env:
          WORKER: ${{ secrets.WORKER }}
          VS: ${{ secrets.VIDEO_SECRET }}
          CHAT: ${{ github.event.client_payload.chat }}
          JOB: ${{ github.event.client_payload.job }}
        run: |
          curl -s -G "$WORKER/vdone" -H "X-Video: $VS" --data-urlencode "ok=${{ job.status == 'success' && '1' || '0' }}" --data-urlencode "chat=$CHAT" --data-urlencode "job=$JOB" || true
